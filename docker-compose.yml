version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: bbva-rag-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: bbva-rag-app
    depends_on:
      - mongo
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

volumes:
  mongo_data:
